services:
  - type: web
    name: unikart-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8088
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: unikart-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: unikart-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: unikart-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: unikart-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: unikart-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://unikart-backend.onrender.com/api/v1
      - key: NODE_VERSION
        value: 20.11.0

databases:
  - name: unikart-db
    plan: free
    databaseName: unikart
    user: unikart

